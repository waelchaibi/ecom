<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <div class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white f-w-700 m-b-8" style="width: 48px; height: 48px">
              S
            </div>
            <h4 class="f-w-600 m-b-4">Welcome back</h4>
            <p class="f-s-14 text-muted m-b-0">Sign in with your customer email</p>
          </div>

          @if (error) {
            <div class="bg-light-error text-error rounded p-12 m-t-24">{{ error }}</div>
          }

          <form class="m-t-24" (ngSubmit)="submit()">
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput type="email" name="email" [(ngModel)]="email" autocomplete="email" required />
            </mat-form-field>

            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
            </mat-form-field>

            <button mat-flat-button color="primary" class="w-100" type="submit" [disabled]="loading">
              {{ loading ? 'Signing in…' : 'Sign in' }}
            </button>
          </form>

          <span class="d-block f-w-500 text-center m-t-24">
            New to Olympia?
            <a routerLink="/account/register" class="text-decoration-none text-primary f-w-500 f-s-14">Create an account</a>
          </span>
          <span class="d-block f-w-500 text-center m-t-8">
            Admin?
            <a routerLink="/login" class="text-decoration-none text-primary f-w-500 f-s-14">Admin sign in</a>
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
