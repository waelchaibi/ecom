@if (visible) {
  <div class="chat-root">
    @if (open) {
      <mat-card class="cardWithShadow chat-panel" role="dialog" aria-label="Assistant">
        <div class="chat-head">
          <strong class="f-w-600">Assistant</strong>
          <div class="chat-head-actions">
            <button type="button" mat-stroked-button (click)="newChat()" [disabled]="busy">New</button>
            <button type="button" mat-stroked-button (click)="toggle()">Close</button>
          </div>
        </div>

        @if (error) {
          <p class="chat-err">{{ error }}</p>
        }

        <div class="chat-body">
          <aside class="chat-threads">
            @for (t of threads; track t.id) {
              <button
                type="button"
                class="thread"
                [class.active]="t.id === activeThreadId"
                (click)="selectThread(t.id)"
              >
                {{ t.title }}
              </button>
            } @empty {
              <p class="text-muted f-s-14">No chats yet.</p>
            }
          </aside>

          <div class="chat-messages">
            @for (m of messages; track m.id) {
              <div class="bubble" [class.user]="m.role === 'user'" [class.assistant]="m.role === 'assistant'">
                <span class="role">{{ m.role === 'user' ? 'You' : 'Bot' }}</span>
                <p>{{ m.content }}</p>
              </div>
            } @empty {
              <p class="text-muted f-s-14">Ask about products, stock, orders… (FR / EN)</p>
            }
          </div>
        </div>

        <form class="chat-compose" (ngSubmit)="send()">
          <mat-form-field appearance="outline" class="chat-input" subscriptSizing="dynamic" color="primary">
            <input
              matInput
              name="draft"
              [(ngModel)]="draft"
              placeholder="Your question…"
              [disabled]="busy"
              autocomplete="off"
            />
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit" [disabled]="busy || !draft.trim()">
            {{ busy ? '…' : 'Send' }}
          </button>
        </form>
      </mat-card>
    }

    <button
      type="button"
      mat-fab
      color="primary"
      class="chat-fab"
      (click)="toggle()"
      [attr.aria-label]="open ? 'Close assistant' : 'Open assistant'"
    >
      @if (open) {
        <mat-icon>close</mat-icon>
      } @else {
        <mat-icon>chat</mat-icon>
      }
    </button>
  </div>
}
