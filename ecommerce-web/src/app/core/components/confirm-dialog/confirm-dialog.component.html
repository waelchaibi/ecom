@if (confirmDialog.dialog(); as d) {
  <div class="confirm-overlay" role="presentation">
    <button type="button" class="confirm-backdrop" aria-label="Close dialog" (click)="confirmDialog.dismiss()"></button>
    <mat-card
      class="cardWithShadow confirm-panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
    >
      <mat-card-content class="p-24">
        <h5 id="confirm-dialog-title" class="f-w-600 m-b-8">{{ d.title }}</h5>
        <p class="text-muted f-s-14 m-b-0">{{ d.message }}</p>
        <div class="confirm-actions m-t-24">
          <button type="button" mat-stroked-button (click)="confirmDialog.dismiss()">
            {{ d.cancelLabel }}
          </button>
          <button
            type="button"
            mat-flat-button
            [color]="d.tone === 'danger' ? 'warn' : 'primary'"
            (click)="confirmDialog.accept()"
          >
            {{ d.confirmLabel }}
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
}
